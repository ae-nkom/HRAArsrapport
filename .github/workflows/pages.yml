name: Publiser GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nettside
    steps:
      - name: Hent kildekode
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Sett opp Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nettside/package-lock.json
      - name: Les Pages-oppsett
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Bygg og kontroller publiseringsfiler
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: npx playwright install --with-deps chromium
      - name: Kontroller appen under Pages-stien
        run: npm run test:browser
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Last opp kun nettstedets bygg
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: nettside/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publiser
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
